[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fli"
version = "0.0.1"
description = "File Library Index: agent file libraries on Azure Cosmos DB (docs/spec.md)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "azure-cosmos>=4.9,<5",
  "azure-identity>=1.17,<2",
  "azure-storage-blob>=12.20,<13",
  "azure-servicebus>=7.12,<8",
  "aiohttp>=3.10,<4",  # transport for the azure-*.aio clients
  # Used by inherited/ until Phase 1 moves it into this package (docs/spec.md §13).
  "httpx>=0.27,<1",
  "tiktoken>=0.7,<1",
  "pypdf>=4,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=0.6.23,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
]

[project.scripts]
fli-api = "fli.api:main"
fli-worker = "fli.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fli"]

[tool.pytest.ini_options]
testpaths = ["tests", "inherited/tests"]
# The repo root, so tests can import inherited/ and scripts/.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "."]
# Reference code, linted when Phase 1 moves it into the package (inherited/README.md).
extend-exclude = ["inherited"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
