[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fli"
version = "0.0.1"
description = "File Library Index: agent file libraries on Azure Cosmos DB (docs/spec.md)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",  # FastAPI form and file uploads
  "uvicorn[standard]>=0.30,<1",
  "azure-cosmos>=4.17.1,<5",  # the version every live run used; ranked-query routing differs by version (E27)
  "azure-identity>=1.17,<2",
  "azure-storage-blob>=12.20,<13",
  "azure-servicebus>=7.12,<8",
  "aiohttp>=3.10,<4",  # transport for the azure-*.aio clients
  "httpx>=0.27,<1",
  "tiktoken>=0.7,<1",
  "pypdf>=4,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=0.6.23,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10.1,<14",
]

[project.optional-dependencies]
reuse-lab = ["reportlab>=4.4,<5"]  # opt-in compatibility fixtures only; no application dependency
samples = ["Pillow>=10.1,<14"]
demo = [
  "streamlit>=1.40,<2",
  "openai>=1.50,<4",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
  "openai>=1.50,<4",  # unit tests exercise the optional demo's chat transport and usage accounting
]

[project.scripts]
fli-api = "fli.api:main"
fli-worker = "fli.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fli", "src/fli_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import scripts/.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
