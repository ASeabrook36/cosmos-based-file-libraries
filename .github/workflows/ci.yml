# Lint and unit tests on every push and pull request. No secrets and no Azure:
# live behaviour is checked by scripts/canary.py against a deployed account (CLAUDE.md rule 11).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor in pyproject.toml, and the version development runs on.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: python scripts/check_reference_privacy.py
      - run: python -m pytest -q
